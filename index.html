<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja stránka</title>

    <style>
        body {
            background:
                linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
                url("29421067.jpg") center / cover no-repeat fixed;
            color: white;
            font-family: 'Comic Sans MS', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 40px;
        }

        p {
            color: #aaaaaa;
            font-size: 18px;
        }

        .fotky {
            display: flex;
            justify-content: center;
            align-items: center;

        .fotky img {
            width: 280px;
            max-width: 90vw;

            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <div>
        <h1>ahoj</h1>

        <div class="fotky">
            <img src="_119075393_pride.jpg" alt="Pride">
            <img src="boys-love-cute-kiss-Favim.com-7646888.jpg" alt="Fotka v strede">
